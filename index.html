<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio Adecco</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            adecco: {
              red: '#da291c',
              darkred: '#b81d13',
              lightred: '#fef2f2',
              borderred: '#fecaca'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Encabezado Corporativo -->
  <header class="bg-adecco-red text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white text-adecco-red p-2 rounded-lg font-black text-xl tracking-wider shadow">
          ADECCO
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Directorio Adecco</h1>
          <p class="text-xs text-red-100 font-light">Gestión y Administración de Personal</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="export-btn" onclick="exportToCSV()" class="bg-white/10 hover:bg-white/20 text-white border border-white/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-file-excel text-emerald-300"></i>
          <span>Excel (CSV)</span>
        </button>
        <button onclick="exportBackupJSON()" class="bg-white/10 hover:bg-white/20 text-white border border-white/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-download text-blue-300"></i>
          <span>Respaldar JSON</span>
        </button>
        <label class="bg-white/10 hover:bg-white/20 text-white border border-white/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
          <i class="fa-solid fa-upload text-amber-300"></i>
          <span>Cargar JSON</span>
          <input type="file" id="import-json-input" accept=".json" class="hidden" onchange="importBackupJSON(event)">
        </label>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- Dashboard de Métricas / Contadores -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl p-5 border border-slate-200 border-t-4 border-t-adecco-red shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Registrados</p>
          <p id="count-total" class="text-3xl font-extrabold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
          <i class="fa-solid fa-users text-xl"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl p-5 border border-slate-200 border-t-4 border-t-blue-500 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Perfil Ingreso</p>
          <p id="count-ingreso" class="text-3xl font-extrabold text-blue-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <i class="fa-solid fa-user-plus text-xl"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl p-5 border border-slate-200 border-t-4 border-t-amber-500 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Perfil Medio</p>
          <p id="count-medio" class="text-3xl font-extrabold text-amber-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-600">
          <i class="fa-solid fa-user-gear text-xl"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl p-5 border border-slate-200 border-t-4 border-t-emerald-500 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Perfil Tutor</p>
          <p id="count-tutor" class="text-3xl font-extrabold text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600">
          <i class="fa-solid fa-user-graduate text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Layout Dividido: Formulario y Lista -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- Formulario de Registro / Edición -->
      <div class="lg:col-span-5 bg-white rounded-xl border border-slate-200 shadow-sm p-6 sticky top-24">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
          <h2 id="form-title" class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-adecco-red"></i>
            <span>Agregar Trabajador</span>
          </h2>
          <span id="edit-badge" class="hidden px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">
            Modo Edición
          </span>
        </div>

        <form id="worker-form" class="space-y-4" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="worker-id">

          <!-- Fotografía -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Fotografía del Trabajador</label>
            <div class="flex flex-col items-center bg-slate-50 p-4 rounded-xl border border-dashed border-slate-300">
              <img id="photo-preview" src="https://placehold.co/150x150/e2e8f0/64748b?text=Sin+Foto" alt="Vista previa" class="w-24 h-24 rounded-full object-cover border-2 border-adecco-red shadow-sm mb-3">
              
              <!-- Visor de Cámara -->
              <div id="camera-container" class="hidden w-full max-w-xs text-center mb-3">
                <video id="video" autoplay playsinline class="w-full h-36 rounded-lg bg-black object-cover mb-2 border border-slate-300"></video>
                <button type="button" onclick="takeSnapshot()" class="bg-slate-800 hover:bg-black text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                  <i class="fa-solid fa-camera me-1"></i> Capturar Fotografía
                </button>
              </div>

              <div class="flex flex-wrap gap-2 justify-center">
                <button type="button" onclick="startCamera()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                  <i class="fa-solid fa-video"></i>
                  <span>Usar Cámara</span>
                </button>
                <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition cursor-pointer flex items-center gap-1">
                  <i class="fa-solid fa-upload"></i>
                  <span>Subir Archivo</span>
                  <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </label>
              </div>
            </div>
          </div>

          <!-- Campo Nombre -->
          <div>
            <label for="nombre" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nombre Completo *</label>
            <input type="text" id="nombre" required placeholder="Ej: Juan Pérez Morales" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-adecco-red focus:border-adecco-red outline-none transition">
          </div>

          <!-- Campo Teléfono -->
          <div>
            <label for="telefono" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Teléfono de Contacto *</label>
            <input type="tel" id="telefono" required placeholder="Ej: +56 9 1234 5678" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-adecco-red focus:border-adecco-red outline-none transition">
          </div>

          <!-- Campo Perfil -->
          <div>
            <label for="perfil" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Perfil del Trabajador *</label>
            <select id="perfil" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-adecco-red focus:border-adecco-red outline-none transition bg-white">
              <option value="Ingreso">Ingreso</option>
              <option value="Medio">Medio</option>
              <option value="Tutor">Tutor</option>
            </select>
          </div>

          <!-- Botones Formulario -->
          <div class="pt-2 flex flex-col gap-2">
            <button type="submit" id="submit-btn" class="w-full bg-adecco-red hover:bg-adecco-darkred text-white py-2.5 rounded-lg text-sm font-semibold shadow-sm transition">
              Guardar Trabajador
            </button>
            <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-lg text-sm font-semibold transition">
              Cancelar Edición
            </button>
          </div>
        </form>
      </div>

      <!-- Listado y Búsqueda -->
      <div class="lg:col-span-7 space-y-4">
        
        <!-- Barra de Búsqueda y Filtro de Perfil -->
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
          <div class="relative w-full sm:w-2/3">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" oninput="renderWorkers()" placeholder="Buscar por nombre..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-adecco-red focus:border-adecco-red outline-none transition">
          </div>
          <div class="w-full sm:w-1/3">
            <select id="filter-perfil" onchange="renderWorkers()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-adecco-red focus:border-adecco-red outline-none transition bg-white">
              <option value="Todos">Todos los Perfiles</option>
              <option value="Ingreso">Perfil Ingreso</option>
              <option value="Medio">Perfil Medio</option>
              <option value="Tutor">Perfil Tutor</option>
            </select>
          </div>
        </div>

        <!-- Contenedor de Lista de Trabajadores -->
        <div id="worker-list" class="space-y-3">
          <!-- Elementos dinámicos mediante JavaScript -->
        </div>

      </div>

    </div>
  </main>

  <!-- Modal de Mensajes / Notificaciones UI -->
  <div id="modal-alert" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div id="modal-icon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl"></div>
      <h3 id="modal-title" class="text-lg font-bold text-slate-900"></h3>
      <p id="modal-message" class="text-sm text-slate-600"></p>
      <div class="pt-2 flex justify-center gap-2" id="modal-actions">
        <button onclick="closeModal()" class="bg-slate-800 hover:bg-black text-white px-5 py-2 rounded-lg text-sm font-semibold transition">Aceptar</button>
      </div>
    </div>
  </div>

  <script>
    // Estado Global de la aplicación
    let workers = [];
    let currentPhotoBase64 = '';
    let videoStream = null;

    // Inicialización al cargar el DOM
    document.addEventListener('DOMContentLoaded', () => {
      loadWorkersFromStorage();
      renderWorkers();
      updateStats();
    });

    // Cargar trabajadores desde localStorage
    function loadWorkersFromStorage() {
      try {
        const data = localStorage.getItem('adecco_workers');
        workers = data ? JSON.parse(data) : [];
      } catch (e) {
        console.error("Error al leer localStorage:", e);
        workers = [];
      }
    }

    // Guardar trabajadores en localStorage
    function saveWorkersToStorage() {
      try {
        localStorage.setItem('adecco_workers', JSON.stringify(workers));
      } catch (e) {
        showCustomAlert("Error de Almacenamiento", "No se pudo guardar la información localmente. El tamaño de la foto podría ser demasiado grande.", "error");
      }
    }

    // Procesar Formulario (Creación o Edición)
    function handleFormSubmit(event) {
      event.preventDefault();

      const id = document.getElementById('worker-id').value;
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const perfil = document.getElementById('perfil').value;

      const workerData = {
        id: id ? Number(id) : Date.now(),
        nombre: nombre,
        telefono: telefono,
        perfil: perfil,
        photo: currentPhotoBase64 || 'https://placehold.co/150x150/e2e8f0/64748b?text=Sin+Foto'
      };

      if (id) {
        // Modo Edición
        workers = workers.map(w => w.id === Number(id) ? workerData : w);
        showCustomAlert("Trabajador Actualizado", "Los datos del trabajador se han modificado con éxito.", "success");
      } else {
        // Modo Creación
        workers.push(workerData);
        showCustomAlert("Trabajador Registrado", "El nuevo trabajador fue agregado al directorio de Adecco.", "success");
      }

      saveWorkersToStorage();
      renderWorkers();
      updateStats();
      resetForm();
    }

    // Renderizar la lista de trabajadores con filtros
    function renderWorkers() {
      const listContainer = document.getElementById('worker-list');
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const perfilFilter = document.getElementById('filter-perfil').value;

      const filtered = workers.filter(w => {
        const matchesSearch = w.nombre.toLowerCase().includes(search);
        const matchesPerfil = perfilFilter === 'Todos' || w.perfil === perfilFilter;
        return matchesSearch && matchesPerfil;
      });

      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
              <i class="fa-solid fa-address-book text-2xl"></i>
            </div>
            <h3 class="text-slate-700 font-semibold text-base mb-1">Sin Registros Encontrados</h3>
            <p class="text-slate-500 text-xs">No hay trabajadores que coincidan con los criterios de búsqueda o el directorio está vacío.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(w => {
        const item = document.createElement('div');
        item.className = 'bg-white rounded-xl border border-slate-200 border-l-4 border-l-adecco-red p-4 shadow-sm hover:shadow transition flex flex-col sm:flex-row items-center gap-4';

        // Badge Perfil Style
        let badgeStyle = 'bg-blue-50 text-blue-700 border-blue-200';
        if (w.perfil === 'Medio') badgeStyle = 'bg-amber-50 text-amber-700 border-amber-200';
        if (w.perfil === 'Tutor') badgeStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200';

        item.innerHTML = `
          <img src="${w.photo}" alt="${w.nombre}" class="w-16 h-16 rounded-full object-cover border border-slate-200 flex-shrink-0">
          <div class="flex-1 text-center sm:text-left min-w-0">
            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3">
              <h4 class="font-bold text-slate-900 text-base truncate">${escapeHtml(w.nombre)}</h4>
              <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badgeStyle} self-center sm:self-auto">
                ${escapeHtml(w.perfil)}
              </span>
            </div>
            <div class="text-xs text-slate-500 mt-1 space-y-0.5">
              <p><strong class="text-slate-700">Teléfono:</strong> ${escapeHtml(w.telefono)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 w-full sm:w-auto justify-end">
            <button onclick="editWorker(${w.id})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1">
              <i class="fa-solid fa-pen-to-square"></i>
              <span>Editar</span>
            </button>
            <button onclick="confirmDeleteWorker(${w.id})" class="bg-red-50 hover:bg-red-100 text-adecco-red px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1">
              <i class="fa-solid fa-trash-can"></i>
              <span>Eliminar</span>
            </button>
          </div>
        `;

        listContainer.appendChild(item);
      });
    }

    // Actualizar métricas del Dashboard
    function updateStats() {
      document.getElementById('count-total').textContent = workers.length;
      document.getElementById('count-ingreso').textContent = workers.filter(w => w.perfil === 'Ingreso').length;
      document.getElementById('count-medio').textContent = workers.filter(w => w.perfil === 'Medio').length;
      document.getElementById('count-tutor').textContent = workers.filter(w => w.perfil === 'Tutor').length;
    }

    // Editar trabajador
    function editWorker(id) {
      const worker = workers.find(w => w.id === id);
      if (!worker) return;

      document.getElementById('worker-id').value = worker.id;
      document.getElementById('nombre').value = worker.nombre;
      document.getElementById('telefono').value = worker.telefono;
      document.getElementById('perfil').value = worker.perfil;

      currentPhotoBase64 = worker.photo;
      document.getElementById('photo-preview').src = worker.photo;

      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-user-pen text-amber-500"></i><span>Editar Trabajador</span>`;
      document.getElementById('submit-btn').textContent = 'Actualizar Datos';
      document.getElementById('edit-badge').classList.remove('hidden');
      document.getElementById('cancel-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Confirmación de eliminación
    function confirmDeleteWorker(id) {
      const worker = workers.find(w => w.id === id);
      if (!worker) return;

      showCustomConfirm("Eliminar Trabajador", `¿Está seguro de eliminar a <strong>${escapeHtml(worker.nombre)}</strong> del directorio?`, () => {
        workers = workers.filter(w => w.id !== id);
        saveWorkersToStorage();
        renderWorkers();
        updateStats();
        showCustomAlert("Eliminado", "El trabajador ha sido eliminado del sistema.", "success");
      });
    }

    // Cancelar/Resetear Formulario
    function resetForm() {
      document.getElementById('worker-form').reset();
      document.getElementById('worker-id').value = '';
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').src = 'https://placehold.co/150x150/e2e8f0/64748b?text=Sin+Foto';

      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-user-plus text-adecco-red"></i><span>Agregar Trabajador</span>`;
      document.getElementById('submit-btn').textContent = 'Guardar Trabajador';
      document.getElementById('edit-badge').classList.add('hidden');
      document.getElementById('cancel-btn').classList.add('hidden');

      stopCamera();
    }

    // Selección de archivo local
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          document.getElementById('photo-preview').src = currentPhotoBase64;
          stopCamera();
        };
        reader.readAsDataURL(file);
      }
    }

    // Iniciar cámara web
    async function startCamera() {
      try {
        stopCamera();
        videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = videoStream;
        document.getElementById('camera-container').classList.remove('hidden');
      } catch (err) {
        showCustomAlert("Error de Cámara", "No se pudo acceder a la cámara del dispositivo. Verifica los permisos de tu navegador.", "error");
      }
    }

    // Capturar foto desde la cámara
    function takeSnapshot() {
      const video = document.getElementById('video');
      if (!videoStream) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 300;
      canvas.height = video.videoHeight || 300;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('photo-preview').src = currentPhotoBase64;

      stopCamera();
    }

    // Detener la cámara
    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('camera-container').classList.add('hidden');
    }

    // Exportación a Excel (CSV con soporte UTF-8)
    function exportToCSV() {
      if (workers.length === 0) {
        showCustomAlert("Sin Datos", "No hay trabajadores registrados en la lista para exportar.", "warning");
        return;
      }

      const headers = ['Nombre Completo', 'Teléfono', 'Perfil'];
      
      const rows = workers.map(w => [
        `"${w.nombre.replace(/"/g, '""')}"`,
        `"${w.telefono.replace(/"/g, '""')}"`,
        `"${w.perfil.replace(/"/g, '""')}"`
      ]);

      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `Directorio_Adecco_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Exportar Respaldo en formato JSON
    function exportBackupJSON() {
      if (workers.length === 0) {
        showCustomAlert("Sin Datos", "No hay trabajadores registrados para respaldar.", "warning");
        return;
      }

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workers, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Respaldo_Adecco_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Importar Respaldo JSON
    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const importedWorkers = JSON.parse(e.target.result);
          if (Array.isArray(importedWorkers)) {
            showCustomConfirm("Cargar Respaldo", `Se cargarán ${importedWorkers.length} registros. ¿Deseas reemplazar la lista actual?`, () => {
              workers = importedWorkers;
              saveWorkersToStorage();
              renderWorkers();
              updateStats();
              showCustomAlert("Importación Exitosa", "Base de datos actualizada correctamente.", "success");
            });
          } else {
            showCustomAlert("Formato Inválido", "El archivo JSON no posee la estructura correcta.", "error");
          }
        } catch (err) {
          showCustomAlert("Error de Lectura", "Ocurrió un problema al leer el archivo JSON.", "error");
        }
      };
      fileReader.readAsText(file);
      event.target.value = ''; // Limpiar input para permitir seleccionar el mismo archivo
    }

    // Utilidades para Modales de Alertas
    function showCustomAlert(title, message, type = "info") {
      const modal = document.getElementById('modal-alert');
      const icon = document.getElementById('modal-icon');
      
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').innerHTML = message;

      if (type === 'success') {
        icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl bg-emerald-100 text-emerald-600";
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      } else if (type === 'error') {
        icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl bg-red-100 text-adecco-red";
        icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      } else if (type === 'warning') {
        icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl bg-amber-100 text-amber-600";
        icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
      } else {
        icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl bg-blue-100 text-blue-600";
        icon.innerHTML = '<i class="fa-solid fa-info"></i>';
      }

      document.getElementById('modal-actions').innerHTML = `
        <button onclick="closeModal()" class="bg-slate-800 hover:bg-black text-white px-5 py-2 rounded-lg text-sm font-semibold transition">Aceptar</button>
      `;

      modal.classList.remove('hidden');
    }

    function showCustomConfirm(title, message, onConfirm) {
      const modal = document.getElementById('modal-alert');
      const icon = document.getElementById('modal-icon');

      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').innerHTML = message;

      icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl bg-amber-100 text-amber-600";
      icon.innerHTML = '<i class="fa-solid fa-circle-question"></i>';

      document.getElementById('modal-actions').innerHTML = `
        <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Cancelar</button>
        <button id="confirm-act-btn" class="bg-adecco-red hover:bg-adecco-darkred text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Confirmar</button>
      `;

      document.getElementById('confirm-act-btn').onclick = () => {
        closeModal();
        onConfirm();
      };

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-alert').classList.add('hidden');
    }

    // Sanitizar texto HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
