<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Trabajadores</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { margin-bottom: 24px; text-align: center; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }

    /* Dashboard de Contadores */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
    .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    .stat-card .number { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-top: 4px; }

    /* Secciones de Contenido */
    .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 24px; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 20px; }
    .card-title { font-size: 1.2rem; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    /* Formularios */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }

    /* Fotos y Cámara */
    .photo-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #e2e8f0; display: block; margin: 0 auto 12px; border: 2px solid var(--border); }
    .camera-container { display: none; text-align: center; margin-bottom: 12px; }
    video { width: 100%; max-width: 200px; border-radius: 8px; background: #000; }
    .photo-actions { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }

    /* Botones */
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; width: 100%; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--text-muted); }
    .btn-secondary:hover { background: #475569; }
    .btn-sm { width: auto; padding: 4px 8px; font-size: 0.8rem; }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); color: white; }

    /* Búsqueda y Lista */
    .search-bar { margin-bottom: 16px; }
    .worker-list { display: grid; gap: 12px; }
    .worker-item { display: flex; align-items: center; gap: 16px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .worker-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .worker-info { flex: 1; }
    .worker-info h4 { font-size: 1rem; color: var(--text); }
    .worker-info p { font-size: 0.85rem; color: var(--text-muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: #eff6ff; color: var(--primary); margin-top: 4px; }
    .worker-actions { display: flex; gap: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Directorio de Trabajadores</h1>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Trabajadores</h3><div class="number" id="count-total">0</div></div>
      <div class="stat-card"><h3>Perfil Ingreso</h3><div class="number" id="count-ingreso">0</div></div>
      <div class="stat-card"><h3>Perfil Medio</h3><div class="number" id="count-medio">0</div></div>
      <div class="stat-card"><h3>Perfil Tutor</h3><div class="number" id="count-tutor">0</div></div>
    </div>

    <div class="main-grid">
      <section class="card">
        <h2 class="card-title" id="form-title">Agregar Trabajador</h2>
        <form id="worker-form">
          <input type="hidden" id="worker-id">
          
          <img id="photo-preview" class="photo-preview" src="https://via.placeholder.com/100?text=Foto" alt="Vista previa">
          
          <div class="camera-container" id="camera-container">
            <video id="video" autoplay playsinline></video>
            <button type="button" class="btn btn-sm btn-secondary" id="snap-btn" style="margin-top: 4px;">Tomar Foto</button>
          </div>

          <div class="photo-actions">
            <button type="button" class="btn btn-sm btn-secondary" id="start-camera-btn">Usar Cámara</button>
            <label class="btn btn-sm btn-secondary" style="width: auto; cursor: pointer; text-align: center;">
              Subir Archivo
              <input type="file" id="file-input" accept="image/*" style="display: none;">
            </label>
          </div>

          <div class="form-group">
            <label for="rut">RUT</label>
            <input type="text" id="rut" required placeholder="12.345.678-9">
          </div>
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" required>
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" required placeholder="+56 9 ...">
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="perfil">Perfil</label>
            <select id="perfil" required>
              <option value="Ingreso">Ingreso</option>
              <option value="Medio">Medio</option>
              <option value="Tutor">Tutor</option>
            </select>
          </div>

          <button type="submit" class="btn" id="submit-btn" style="margin-top: 8px;">Guardar Trabajador</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="margin-top: 8px; display: none;">Cancelar Edición</button>
        </form>
      </section>

      <section class="card">
        <h2 class="card-title">Listado de Trabajadores</h2>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Buscar por RUT, nombre o perfil...">
        </div>
        <div class="worker-list" id="worker-list">
          </div>
      </section>
    </div>
  </div>

  <script>
    let workers = JSON.parse(localStorage.getItem('workers')) || [];
    let currentPhotoBase64 = '';
    let videoStream = null;

    // Elementos DOM
    const workerForm = document.getElementById('worker-form');
    const workerList = document.getElementById('worker-list');
    const searchInput = document.getElementById('search-input');
    const photoPreview = document.getElementById('photo-preview');
    const fileInput = document.getElementById('file-input');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const cameraContainer = document.getElementById('camera-container');
    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snap-btn');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
      renderWorkers();
      updateStats();
    });

    // Guardar / Editar Trabajador
    workerForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('worker-id').value;
      const workerData = {
        id: id ? Number(id) : Date.now(),
        rut: document.getElementById('rut').value,
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        email: document.getElementById('email').value,
        perfil: document.getElementById('perfil').value,
        photo: currentPhotoBase64 || 'https://via.placeholder.com/100?text=Sin+Foto'
      };

      if (id) {
        workers = workers.map(w => w.id === Number(id) ? workerData : w);
      } else {
        workers.push(workerData);
      }

      saveAndRefresh();
      resetForm();
    });

    // Renderizar Lista
    function renderWorkers(filter = '') {
      workerList.innerHTML = '';
      const filtered = workers.filter(w => 
        w.nombre.toLowerCase().includes(filter.toLowerCase()) ||
        w.rut.toLowerCase().includes(filter.toLowerCase()) ||
        w.perfil.toLowerCase().includes(filter.toLowerCase())
      );

      if (filtered.length === 0) {
        workerList.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top:20px;">No se encontraron trabajadores.</p>';
        return;
      }

      filtered.forEach(w => {
        const item = document.createElement('div');
        item.className = 'worker-item';
        item.innerHTML = `
          <img src="${w.photo}" alt="${w.nombre}">
          <div class="worker-info">
            <h4>${w.nombre}</h4>
            <p><strong>RUT:</strong> ${w.rut}</p>
            <p><strong>Tel:</strong> ${w.telefono} | <strong>Email:</strong> ${w.email}</p>
            <span class="badge">${w.perfil}</span>
          </div>
          <div class="worker-actions">
            <button class="btn btn-sm btn-warning" onclick="editWorker(${w.id})">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="deleteWorker(${w.id})">Eliminar</button>
          </div>
        `;
        workerList.appendChild(item);
      });
    }

    // Actualizar Estadísticas
    function updateStats() {
      document.getElementById('count-total').textContent = workers.length;
      document.getElementById('count-ingreso').textContent = workers.filter(w => w.perfil === 'Ingreso').length;
      document.getElementById('count-medio').textContent = workers.filter(w => w.perfil === 'Medio').length;
      document.getElementById('count-tutor').textContent = workers.filter(w => w.perfil === 'Tutor').length;
    }

    function saveAndRefresh() {
      localStorage.setItem('workers', JSON.stringify(workers));
      renderWorkers(searchInput.value);
      updateStats();
    }

    // Búsqueda
    searchInput.addEventListener('input', (e) => renderWorkers(e.target.value));

    // Eliminar
    window.deleteWorker = function(id) {
      if (confirm('¿Está seguro de eliminar este trabajador?')) {
        workers = workers.filter(w => w.id !== id);
        saveAndRefresh();
      }
    };

    // Editar
    window.editWorker = function(id) {
      const w = workers.find(item => item.id === id);
      if (!w) return;

      document.getElementById('worker-id').value = w.id;
      document.getElementById('rut').value = w
